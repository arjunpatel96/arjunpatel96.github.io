<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Arjun Patel, PhD</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0705" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .nf{min-height:78vh; display:flex; flex-direction:column; justify-content:center}
    .nf .code{
      font-family:var(--mono); font-size:13px; letter-spacing:.14em;
      text-transform:uppercase; color:var(--flux); margin:0 0 14px;
    }
    .nf h1{font-size:clamp(30px,4vw,46px); margin-bottom:14px}
    .nf p{color:var(--dim); max-width:52ch; margin:0 0 24px; font-size:17px}
  </style>
</head>
<body>
  <header class="header">
    <!-- 0x0 fixed anchors: :target on #menu drives the mobile menu, #menu-closed is the
         inert target the close button jumps to. both must be fixed — targeting anything
         in normal flow scrolls the page out from under the reader. -->
    <i id="menu" class="menu-anchor" aria-hidden="true"></i>
    <i id="menu-closed" class="menu-anchor" aria-hidden="true"></i>
    <div class="container nav">
      <a class="brand" href="/" aria-label="Home">
        <span class="dot"></span><span>Arjun Patel, PhD</span>
      </a>
      <nav class="navlinks" aria-label="Primary">
        <a href="/#about">About</a>
        <a href="/#services">Services</a>
        <a href="/#work">Work</a>
        <a href="/#publications">Publications</a>
        <a href="/#cv">CV</a>
        <a href="/#contact">Contact</a>
      </nav>

      <!-- mobile only; CSS :target drives the open/closed state, no JS -->
      <a class="navtoggle open" href="#menu" aria-label="Open menu"><span class="bars" aria-hidden="true"></span></a>
      <a class="navtoggle close" href="#menu-closed" aria-label="Close menu"><span class="bars" aria-hidden="true"></span></a>
    </div>
  </header>

  <main>
    <section class="section" style="border-top:none">
      <div class="container nf">
        <p class="code">Error 404</p>
        <h1>This page doesn’t exist.</h1>
        <p>The link may be out of date, or the address may have a typo. Everything on this site lives on the front page.</p>
        <div class="cta">
          <a class="btn" href="/">Back to the front page</a>
          <a class="btn ghost" href="/#publications">Publications</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
